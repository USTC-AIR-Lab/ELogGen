[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eloggen"
version = "0.1.0.dev0"
description = "Execution-logic-guided robot dataset generation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license-files = ["LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "numpy>=1.26,<2",
  "h5py>=3.10",
  "PyYAML>=6",
]

[project.optional-dependencies]
sim = [
  "torch",
  "scipy",
  "opencv-python",
  "open3d",
  "cvxpy",
]
dev = ["pytest>=8"]

[project.scripts]
eloggen = "eloggen.cli:main"

[project.entry-points."eloggen.collectors"]
# Hardware collection implementations are installed as separate private/public plugins.

[tool.setuptools.packages.find]
where = ["src"]
include = ["eloggen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
"eloggen.datasets" = [
  "manifest.json",
  "examples/**/*.json",
  "examples/**/*.yaml",
  "examples/**/*.yml",
  "taskpacks/**/*.json",
  "taskpacks/**/*.yaml",
  "taskpacks/**/*.yml",
  "taskpacks/**/*.bddl",
  "taskpacks/**/*.hdf5",
  "taskpacks/**/*.md",
  "taskpacks/**/*.txt",
]
"eloggen.patches" = ["**/*.yaml", "**/*.yml", "**/*.patch"]
